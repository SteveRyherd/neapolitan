<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost your scoop? — Neapolitan</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/img/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/img/favicon-48.png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF3E3;
      --ink: #2B1810;
      --ink-soft: #4A2D1A;
      --ink-mute: #6B5645;
      --chocolate: #6B4226;
      --strawberry: #E8A2B5;
      --vanilla-warm: #F4E4C1;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "DM Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink);
      background: var(--cream);
      background-image:
        radial-gradient(rgba(43, 24, 16, 0.025) 1px, transparent 1px),
        radial-gradient(rgba(43, 24, 16, 0.02) 1px, transparent 1px);
      background-size: 18px 18px, 31px 31px;
      background-position: 0 0, 9px 9px;
      padding: 40px 24px;
    }
    .card {
      max-width: 540px;
      text-align: center;
    }
    .dropped-cone {
      width: min(340px, 82vw);
      height: auto;
      margin: 0 auto 18px;
      display: block;
    }
    .stripes {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      height: 14px;
      max-width: 240px;
      margin: 0 auto 28px;
      border-radius: 4px;
      overflow: hidden;
    }
    .stripes > div:nth-child(1) { background: var(--chocolate); }
    .stripes > div:nth-child(2) { background: var(--strawberry); }
    .stripes > div:nth-child(3) { background: var(--vanilla-warm); }
    .code {
      font-family: "JetBrains Mono", "SF Mono", monospace;
      font-size: 0.85rem;
      color: var(--ink-mute);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 18px;
    }
    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(2.4rem, 6vw, 4rem);
      letter-spacing: -0.02em;
      margin: 0 0 0.4em;
    }
    p {
      font-size: 1.1rem;
      color: var(--ink-soft);
      margin: 0 0 1.5em;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      padding: 14px 26px;
      background: var(--ink);
      color: var(--cream);
      border-radius: 999px;
      text-decoration: none;
      font-weight: 500;
      transition: background 0.15s ease;
    }
    .btn:hover { background: var(--ink-soft); }
  </style>
</head>
<body>
  <main class="card">
    <picture>
      <source srcset="/assets/img/sad-404.webp" type="image/webp">
      <img
        class="dropped-cone"
        src="/assets/img/sad-404.png"
        alt="A dropped Neapolitan ice cream cone"
        width="1254"
        height="977">
    </picture>
    <div class="stripes" aria-hidden="true">
      <div></div>
      <div></div>
      <div></div>
    </div>
    <div class="code">404 · Page not found</div>
    <h1>Lost your scoop?</h1>
    <p>
      This page doesn't exist in any of our environments.
      Maybe a typo, maybe a moved link — either way, the carton is back this way.
    </p>
    <a class="btn" href="/">← Back to neapolitan.page</a>
  </main>
</body>
</html>
